<script type="text/babel">
const RatingRow1 = ({ label, value, onChange, disabled }) => (
  <div className="py-4 border-b border-slate-100 last:border-0 flex flex-col md:flex-row md:items-center justify-between gap-3 text-lg">
    <div className="font-bold text-slate-800 text-xl">{label}</div>
    <div className="flex gap-3">
      {[1, 2, 3, 4, 5].map((s) => (
        <label key={s} className="cursor-pointer">
          <input type="radio" className="peer sr-only" checked={Number(value) === s} disabled={disabled} onChange={() => onChange && onChange(s)} />
          <div className="w-14 h-14 rounded-full border-2 border-slate-300 flex items-center justify-center text-xl font-bold text-slate-600 peer-checked:bg-blue-600 peer-checked:text-white peer-checked:border-blue-600 disabled:opacity-60 hover:border-blue-400 transition-all">
            {s}
          </div>
        </label>
      ))}
    </div>
  </div>
);

const MustItemSelector = ({ title, placeholderName, scoreLabels, valJob, valStr, onChangeJob, onChangeStr, txtValue, onTxtChange }) => (
  <div className="p-6 border-2 border-slate-200 bg-slate-50/50 rounded-2xl space-y-4">
    <div className="text-xl font-extrabold text-blue-900 border-b-2 pb-2">{title}</div>
    <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
      <div className="space-y-2">
        <div className="text-base font-bold text-slate-600">▼ 面接官【事業部】の点数選択</div>
        <div className="space-y-2 bg-white p-4 rounded-xl border-2">
          {[5, 4, 3, 2, 1].map(score => (
            <label key={score} className="flex items-start gap-3 text-base font-medium text-slate-700 cursor-pointer hover:bg-slate-50 p-1.5 rounded">
              <input type="radio" className="mt-1 w-5 h-5 text-blue-600" checked={Number(valJob) === score} onChange={() => onChangeJob(score)} />
              <span><strong className="text-blue-600 font-bold">{score}点：</strong>{scoreLabels[score]}</span>
            </label>
          ))}
        </div>
      </div>
      <div className="space-y-2">
        <div className="text-base font-bold text-slate-600">▼ 面接官【戦略推進部】の点数選択</div>
        <div className="space-y-2 bg-white p-4 rounded-xl border-2">
          {[5, 4, 3, 2, 1].map(score => (
            <label key={score} className="flex items-start gap-3 text-base font-medium text-slate-700 cursor-pointer hover:bg-slate-50 p-1.5 rounded">
              <input type="radio" className="mt-1 w-5 h-5 text-green-600" checked={Number(valStr) === score} onChange={() => onChangeStr(score)} />
              <span><strong className="text-green-600 font-bold">{score}点：</strong>{scoreLabels[score]}</span>
            </label>
          ))}
        </div>
      </div>
    </div>
    <div className="pt-3">
      <textarea className="w-full h-32 p-4 border-2 border-slate-300 rounded-2xl text-lg outline-none focus:border-blue-500 bg-white" placeholder={`【事業部コメント】${placeholderName}に対する具体的な評価コメント`} value={txtValue} onChange={(e)=>onTxtChange(e.target.value)}></textarea>
    </div>
  </div>
);

const InterviewView = ({ candidate, candidates, systemMaster, history, setActivePage }) => {
  const phaseOptions = systemMaster ? systemMaster.filter(m => m['マスタ分類'] === '選考ステップ').map(m => m['名称']) : ['一次面談', '二次選考', '最終選考'];

  const [selectedCanId, setSelectedCanId] = React.useState(candidate ? candidate['応募者ID'] : '');
  const [activeTab, setActiveTab] = React.useState(phaseOptions[0]);
  const [isSubmitting, setIsSubmitting] = React.useState(false);

  const defaultForm1 = { details: '', trigger: '', notes: '', origin: '', comment: '', status: '', info: '', overall: '' };
  const defaultForm2 = { date: '', m1: '', m2: '', p1: '', p2: '', p3: '', s1: '', s2: '', s3: '', p1_txt: '', p2_txt: '', p3_txt: '', pos: '', neg: '', view: '' };
  const defaultForm3 = { r1_p: '', r1_h: '', r2_p: '', r2_h: '', r3_p: '', r3_h: '', r4_p: '', r4_h: '', r5_p: '', r5_h: '', overall: '' };

  const [form1, setForm1] = React.useState(defaultForm1);
  const [ratings1, setRatings1] = React.useState({});
  const [form2, setForm2] = React.useState(defaultForm2);
  const [bonus2, setBonus2] = React.useState({});
  const [form3, setForm3] = React.useState(defaultForm3);

  const currentCandidate = candidates.find(c => c['応募者ID'] === selectedCanId);
  const pastData = history ? history.find(h => h['応募者ID'] === selectedCanId && h['選考フェーズ'] === activeTab) : null;

  React.useEffect(() => {
    if (selectedCanId) {
      const draft = localStorage.getItem(`daiki_ats_draft_${selectedCanId}`);
      if (draft) {
        const parsed = JSON.parse(draft);
        setForm1(parsed.form1 || defaultForm1); setRatings1(parsed.ratings1 || {}); setForm2(parsed.form2 || defaultForm2); setBonus2(parsed.bonus2 || {}); setForm3(parsed.form3 || defaultForm3);
      } else {
        setForm1(defaultForm1); setRatings1({}); setForm2(defaultForm2); setBonus2({}); setForm3(defaultForm3);
      }
    }
  }, [selectedCanId, activeTab]);

  const handleSaveDraft = () => {
    if (!selectedCanId) return;
    localStorage.setItem(`daiki_ats_draft_${selectedCanId}`, JSON.stringify({ form1, ratings1, form2, bonus2, form3 }));
    alert('📝 入力途中データをブラウザに一時保存しました！');
  };

  const scoreDefs = {
    p1: { 5:"難題に自発的に挑戦、成果・学びが明確", 4:"自発的に挑戦、成果あり", 3:"指示があれば挑戦", 2:"途中で諦めがち", 1:"挑戦を避ける" },
    p2: { 5:"自ら課題を発見し行動", 4:"一部自発的行動", 3:"指示に従う", 2:"受動的", 1:"指示待ちのみ" },
    p3: { 5:"最後まで諦めずやり抜く", 4:"困難でも努力を続ける", 3:"支援があれば続けられる", 2:"困難に弱く諦めやすい", 1:"すぐ諦める傾向がある" }
  };

  const mScore = Number(form2.p1||0)+Number(form2.p2||0)+Number(form2.p3||0)+Number(form2.s1||0)+Number(form2.s2||0)+Number(form2.s3||0);
  const bCount = Object.values(bonus2).filter(v => v.checked).length;
  let autoResult = '判定中';
  if (form2.p1 && form2.p2 && form2.p3 && form2.s1 && form2.s2 && form2.s3) {
    if (mScore >= 18) autoResult = '合格 (条件①適合)';
    else if (mScore <= 14) autoResult = '不合格 (条件②適合)';
    else if (mScore >= 15 && mScore <= 17) autoResult = bCount >= 1 ? '合格 (条件③適合)' : '不合格';
  }

  const handleFormSubmit = (e, type) => {
    e.preventDefault(); if (isSubmitting) return; setIsSubmitting(true);
    let submitObj = { candidateId: selectedCanId, interviewType: type, ratings: {} };

    if (type === '一次面談') {
      submitObj.ratings = ratings1; submitObj.trigger = `【確認】${form1.details}\n【きっかけ】${form1.trigger}`;
      submitObj.notes = form1.notes; submitObj.origin = form1.origin; submitObj.comment = form1.comment;
      submitObj.jobHuntingStatus = form1.status; submitObj.internalInfo = form1.info; submitObj.overallResult = form1.overall;
    } else if (type === '二次選考') {
      submitObj.comment = `【面接官】日:${form2.date} 官(事業):${form2.m1} (戦略):${form2.m2}\n【マスト(事業コメント)】\n・P×C(${form2.p1}点): ${form2.p1_txt}\n・自ら動く(${form2.p2}点): ${form2.p2_txt}\n・粘り強さ(${form2.p3}点): ${form2.p3_txt}\n【戦略点】P:${form2.s1} 主:${form2.s2} 粘:${form2.s3}`;
      submitObj.internalInfo = `【戦略所感】ポジ:${form2.pos}\nネガ:${form2.neg}\n所感:${form2.view}\n【判定】${autoResult}`;
      submitObj.notes = `【加点: ${bCount}個】\n` + Object.entries(bonus2).filter(([_,v])=>v.checked).map(([k,v])=> `・${k}: ${v.txt}`).join('\n');
      submitObj.overallResult = autoResult.includes('合格') ? 'ok' : 'ng';
    } else {
      submitObj.comment = `【理念共感】[社長] ${form3.r1_p}\n[HR] ${form3.r1_h}\n\n【魅力】[社長] ${form3.r2_p}\n[HR] ${form3.r2_h}`;
      submitObj.internalInfo = `【期待】[社長] ${form3.r3_p}\n[HR] ${form3.r3_h}\n\n【課題】[社長] ${form3.r4_p}\n[HR] ${form3.r4_h}`;
      submitObj.notes = `【その他】[社長] ${form3.r5_p}\n[HR] ${form3.r5_h}`; submitObj.overallResult = form3.overall;
    }

    google.script.run
      .withSuccessHandler(() => { localStorage.removeItem(`daiki_ats_draft_${selectedCanId}`); alert(`${type}評価保存完了！`); window.location.reload(); })
      .withFailureHandler((err) => { alert("エラー: " + err); setIsSubmitting(false); })
      .saveInterviewResult(submitObj);
  };

  return (
    <main className="flex-1 overflow-y-auto bg-slate-50 text-lg relative flex flex-col">
      <div className="sticky top-0 z-40 bg-slate-50/95 backdrop-blur-md pt-6 md:pt-8 border-b-2 border-slate-300 shadow-md">
        <div className="max-w-6xl mx-auto px-6 md:px-10 space-y-6">
          <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex flex-col md:flex-row gap-8 items-center justify-between">
            <div className="w-full md:w-1/3">
              <label className="block text-sm font-bold text-slate-500 mb-1">評価対象の候補者</label>
              <select className="w-full p-3 border-2 rounded-xl text-lg font-black text-slate-900 bg-slate-50" value={selectedCanId} onChange={(e) => setSelectedCanId(e.target.value)}>
                <option value="">-- 候補者を選択 --</option>
                {candidates.map(c => <option key={c['応募者ID']} value={c['応募者ID']}>{c['姓']}{c['名']}</option>)}
              </select>
            </div>
            {currentCandidate && (
              <div className="flex-1 w-full grid grid-cols-1 sm:grid-cols-2 gap-4 bg-slate-50 p-4 rounded-xl border">
                <div><strong className="block text-xs text-slate-400">学歴・区分</strong><span className="text-base font-bold">{currentCandidate['大学名']} {currentCandidate['学部名']} ({currentCandidate['採用区分']})</span></div>
                <div><strong className="block text-xs text-slate-400">現在のステータス</strong><span className="text-xl font-black text-blue-600">{currentCandidate['現在のステータス']}</span></div>
              </div>
            )}
          </div>
          {selectedCanId && (
            <div className="flex bg-white px-6 pt-3 rounded-t-xl border-t-2 border-x-2 overflow-x-auto whitespace-nowrap translate-y-px">
              {phaseOptions.map(tab => (
                <button key={tab} onClick={() => setActiveTab(tab)} className={`px-6 py-3 text-lg font-extrabold mr-4 ${activeTab === tab ? 'border-b-4 border-blue-600 text-blue-600 bg-blue-50/40 rounded-t-lg' : 'text-slate-400 hover:text-slate-600'}`}>
                  {tab}
                </button>
              ))}
            </div>
          )}
        </div>
      </div>

      <div className="max-w-6xl mx-auto w-full px-6 md:px-10 pb-10 flex-1">
        {selectedCanId && (
          <div className="bg-white p-6 md:p-8 rounded-b-2xl border-x-2 border-b-2 shadow-sm mt-0">
            {pastData ? (
              <div className="space-y-6">
                <div className="bg-amber-50 border p-4 rounded-xl font-bold text-amber-800">🔒 この選考は提出済です (閲覧専用モード)</div>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                  <div className="border p-5 rounded-xl bg-slate-50 space-y-3">
                    <h3 className="font-extrabold text-slate-800 border-b pb-1">📊 評価・判定</h3>
                    <div><strong>面接日:</strong> {pastData['面談・面接日']}</div>
                    <div><strong>判定結果:</strong> <span className="font-black text-blue-600 text-xl">{pastData['総合評価結果']}</span></div>
                  </div>
                  <div className="border p-5 rounded-xl space-y-3">
                    <h3 className="font-extrabold text-slate-800 border-b pb-1">📝 担当者まとめ</h3>
                    <div className="bg-slate-50 p-3 rounded font-mono text-sm whitespace-pre-wrap">{pastData['面談担当者まとめ']}</div>
                  </div>
                </div>
              </div>
            ) : (
              <div>
                {activeTab === '一次面談' && (
                  <form onSubmit={(e) => handleFormSubmit(e, '一次面談')} className="space-y-6">
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                      <div className="border p-5 rounded-xl bg-slate-50/40 space-y-4">
                        <h3 className="font-bold text-slate-800 border-b">💡 確認事項</h3>
                        <textarea className="w-full h-32 p-3 border rounded-xl text-base outline-none bg-white" placeholder="面談日、職種、転勤可否、希望エリアなど" value={form1.details} onChange={(e)=>setForm1({...form1, details:e.target.value})}></textarea>
                        <textarea className="w-full h-20 p-3 border rounded-xl text-base outline-none bg-white" placeholder="当社を知ったきっかけ" value={form1.trigger} onChange={(e)=>setForm1({...form1, trigger:e.target.value})}></textarea>
                        <textarea className="w-full h-32 p-3 border rounded-xl text-base outline-none bg-white" placeholder="学生からの質問・感想 / 備考" value={form1.notes} onChange={(e)=>setForm1({...form1, notes:e.target.value})}></textarea>
                      </div>
                      <div className="border p-5 rounded-xl bg-white space-y-1">
                        <h3 className="font-bold text-slate-800 border-b pb-1">⭐ 面談評価</h3>
                        {["身だしなみ", "積極性", "態度", "協調性", "対話", "知識"].map(k => (
                          <RatingRow1 key={k} label={`（${k}）`} value={ratings1[k]} onChange={(s) => setRatings1({...ratings1, [k]:s})} />
                        ))}
                      </div>
                    </div>
                    <div className="border-2 border-blue-100 p-6 rounded-2xl bg-blue-50/20 space-y-4">
                      <h3 className="font-black text-blue-900 border-b pb-1">🔒 人事採用課内秘匿情報</h3>
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-base">
                        <div><label className="block font-bold text-slate-600 mb-1">自分らしさの原点</label><textarea className="w-full h-32 p-3 border rounded-xl bg-white outline-none" value={form1.origin} onChange={(e)=>setForm1({...form1, origin:e.target.value})}></textarea></div>
                        <div><label className="block font-bold text-slate-600 mb-1">面談者まとめ</label><textarea className="w-full h-32 p-3 border rounded-xl bg-white outline-none" value={form1.comment} onChange={(e)=>setForm1({...form1, comment:e.target.value})}></textarea></div>
                        <div><label className="block font-bold text-slate-600 mb-1">他社就活状況</label><textarea className="w-full h-24 p-3 border rounded-xl bg-white outline-none" value={form1.status} onChange={(e)=>setForm1({...form1, status:e.target.value})}></textarea></div>
                        <div><label className="block font-bold text-slate-600 mb-1">その他交渉材料など</label><textarea className="w-full h-24 p-3 border rounded-xl bg-white outline-none" value={form1.info} onChange={(e)=>setForm1({...form1, info:e.target.value})}></textarea></div>
                      </div>
                    </div>
                    <div className="flex flex-col sm:flex-row items-center justify-between border-t pt-4 gap-4">
                      <div className="flex gap-6 font-black text-slate-800">
                        {[['ok','合格'], ['hold','再考察'], ['ng','不合格']].map(([v, l]) => (
                          <label key={v} className="flex items-center gap-2 cursor-pointer"><input type="radio" name="f1-res" value={v} className="w-5 h-5 text-blue-600" onChange={(e)=>setForm1({...form1, overall:e.target.value})}/> {l}</label>
                        ))}
                      </div>
                      <div className="flex gap-3 w-full sm:w-auto">
                        <button type="button" onClick={handleSaveDraft} className="flex-1 sm:flex-none px-6 py-3 bg-slate-200 font-bold rounded-xl text-base">💾 一時保存</button>
                        <button type="submit" disabled={!form1.overall||isSubmitting} className="flex-1 sm:flex-none px-8 py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl text-base disabled:bg-slate-300 shadow-md">評価を登録する</button>
                      </div>
                    </div>
                  </form>
                )}

                {activeTab === '二次選考' && (
                  <form onSubmit={(e) => handleFormSubmit(e, '二次選考')} className="space-y-6 pb-44">
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4 border p-4 rounded-xl bg-slate-50 text-base">
                      <div><label className="block font-bold mb-1">受験日</label><input type="date" className="w-full p-2 border rounded-lg font-bold" value={form2.date} onChange={(e)=>setForm2({...form2, date:e.target.value})}/></div>
                      <div><label className="block font-bold mb-1">面接官【事業部】</label><input type="text" className="w-full p-2 border rounded-lg" placeholder="部署・氏名" value={form2.m1} onChange={(e)=>setForm2({...form2, m1:e.target.value})}/></div>
                      <div><label className="block font-bold mb-1">面接官【戦略推進部】</label><input type="text" className="w-full p-2 border rounded-lg" placeholder="氏名" value={form2.m2} onChange={(e)=>setForm2({...form2, m2:e.target.value})}/></div>
                    </div>
                    <div className="space-y-4">
                      <MustItemSelector title="① PROTECT×CHANGE（チャレンジ精神）" placeholderName="PROTECT×CHANGE" scoreLabels={scoreDefs.p1} valJob={form2.p1} valStr={form2.s1} onChangeJob={(s)=>setForm2({...form2, p1:s})} onChangeStr={(s)=>setForm2({...form2, s1:s})} txtValue={form2.p1_txt} onTxtChange={(txt)=>setForm2({...form2, p1_txt:txt})} />
                      <MustItemSelector title="② 自ら動く（主体性）" placeholderName="自ら動く" scoreLabels={scoreDefs.p2} valJob={form2.p2} valStr={form2.s2} onChangeJob={(s)=>setForm2({...form2, p2:s})} onChangeStr={(s)=>setForm2({...form2, s2:s})} txtValue={form2.p2_txt} onTxtChange={(txt)=>setForm2({...form2, p2_txt:txt})} />
                      <MustItemSelector title="③ スッテモムイデモ（粘り強さ）" placeholderName="スッテモムイデモ" scoreLabels={scoreDefs.p3} valJob={form2.p3} valStr={form2.s3} onChangeJob={(s)=>setForm2({...form2, p3:s})} onChangeStr={(s)=>setForm2({...form2, s3:s})} txtValue={form2.p3_txt} onTxtChange={(txt)=>setForm2({...form2, p3_txt:txt})} />
                    </div>
                    <div className="border p-6 rounded-2xl bg-white space-y-4">
                      <h3 className="text-xl font-bold text-slate-800 border-b pb-1">➕ 加点項目</h3>
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-base">
                        {['レスポンス・コミュニケーション','成長意欲','責任感','真面目','ユーモア(表現力)','積極的','真摯さ','謙虚な姿勢','前向きさ','チームワーク','変化に気が付く対応する','その他'].map(k => (
                          <div key={k} className="p-4 border rounded-xl bg-slate-50/50 space-y-2">
                            <label className="flex items-center gap-2 font-bold text-slate-700 cursor-pointer">
                              <input type="checkbox" className="w-5 h-5" checked={bonus2[k]?.checked||false} onChange={(e)=>setBonus2({...bonus2, [k]:{...bonus2[k], checked:e.target.checked}})}/>
                              <span>{k}</span>
                            </label>
                            {bonus2[k]?.checked && <textarea className="w-full h-24 p-2 border rounded-lg bg-white text-sm" placeholder="具体的な加点コメント" value={bonus2[k]?.txt||''} onChange={(e)=>setBonus2({...bonus2, [k]:{...bonus2[k], txt:e.target.value}})}></textarea>}
                          </div>
                        ))}
                      </div>
                    </div>
                    <div className="border p-6 rounded-2xl bg-slate-50 space-y-4">
                      <h3 className="text-xl font-bold text-slate-800">人事（戦略推進部）まとめ</h3>
                      <div className="space-y-4 text-base">
                        <div><label className="block font-bold text-slate-600 mb-1">● ポジティブ要素</label><textarea className="w-full h-28 p-3 border rounded-xl bg-white" value={form2.pos} onChange={(e)=>setForm2({...form2, pos:e.target.value})}></textarea></div>
                        <div><label className="block font-bold text-slate-600 mb-1">● ネガティブ要素</label><textarea className="w-full h-28 p-3 border rounded-xl bg-white" value={form2.neg} onChange={(e)=>setForm2({...form2, neg:e.target.value})}></textarea></div>
                        <div><label className="block font-bold text-slate-600 mb-1">● その他所感</label><textarea className="w-full h-28 p-3 border rounded-xl bg-white" value={form2.view} onChange={(e)=>setForm2({...form2, view:e.target.value})}></textarea></div>
                      </div>
                    </div>
                    <div className="fixed bottom-6 right-6 left-6 md:left-[17rem] z-40 bg-slate-900 text-white p-5 rounded-2xl border-2 border-slate-700 max-w-6xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
                      <div className="flex gap-6 text-base">
                        <div>マスト合計: <span className="text-2xl font-mono font-bold text-blue-400">{mScore}</span>/30点</div>
                        <div>加点数: <span className="text-2xl font-mono font-bold text-green-400">{bCount}</span>個</div>
                        <div>判定: <span className="text-2xl font-black text-yellow-400">{autoResult}</span></div>
                      </div>
                      <div className="flex gap-3 w-full sm:w-auto">
                        <button type="button" onClick={handleSaveDraft} className="flex-1 sm:flex-none px-5 py-2.5 bg-slate-700 font-bold rounded-xl text-sm">💾 一時保存</button>
                        <button type="submit" disabled={autoResult==='判定中'||isSubmitting} className="flex-1 sm:flex-none px-8 py-2.5 bg-blue-600 text-white font-bold rounded-xl text-sm disabled:bg-slate-500">評価提出</button>
                      </div>
                    </div>
                  </form>
                )}

                {activeTab === '最終選考' && (
                  <form onSubmit={(e) => handleFormSubmit(e, '最終選考')} className="space-y-6">
                    {[['🤝 1. 理念共感度', 'r1_p', 'r1_h', '志望理由に理念への共感が入っているか'], ['💎 2. 魅力点', 'r2_p', 'r2_h', '学生のどのような価値観に共感できたか'], ['🚀 3. 期待点', 'r3_p', 'r3_h', '活躍する姿を想像できたか'], ['📈 4. 課題点', 'r4_p', 'r4_h', '今後もっと成長が必要なポイント'], ['📎 5. その他', 'r5_p', 'r5_h', '特記事項']].map(([title, pk, hk, desc]) => (
                      <div key={title} className="bg-slate-50 p-6 rounded-2xl border">
                        <label className="block font-black text-slate-900 text-xl mb-1">{title}</label>
                        <p className="text-xs text-slate-400 mb-4">{desc}</p>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-base">
                          <div><div className="font-bold text-blue-800 text-sm mb-1">👔 社長 コメント</div><textarea className="w-full h-32 p-3 border rounded-xl bg-white outline-none focus:border-blue-500" value={form3[pk]} onChange={(e)=>setForm3({...form3, [pk]:e.target.value})}></textarea></div>
                          <div><div className="font-bold text-purple-800 text-sm mb-1">👤 HR管掌役員 コメント</div><textarea className="w-full h-32 p-3 border rounded-xl bg-white outline-none focus:border-purple-500" value={form3[hk]} onChange={(e)=>setForm3({...form3, [hk]:e.target.value})}></textarea></div>
                        </div>
                      </div>
                    ))}
                    <div className="flex flex-col sm:flex-row items-center justify-between border-t pt-4 gap-4">
                      <div className="flex gap-6 font-black text-slate-800">
                        {[['ok','合格'], ['hold','再考察'], ['ng','不合格']].map(([v, l]) => (
                          <label key={v} className="flex items-center gap-2 cursor-pointer"><input type="radio" name="f3-res" value={v} className="w-5 h-5 text-blue-600" onChange={(e)=>setForm3({...form3, overall:e.target.value})}/> {l}</label>
                        ))}
                      </div>
                      <div className="flex gap-3 w-full sm:w-auto">
                        <button type="button" onClick={handleSaveDraft} className="flex-1 sm:flex-none px-6 py-3 bg-slate-200 font-bold rounded-xl text-base">💾 一時保存</button>
                        <button type="submit" disabled={!form3.overall||isSubmitting} className="flex-1 sm:flex-none px-10 py-3 bg-blue-600 text-white font-bold rounded-xl text-base disabled:bg-slate-300 shadow-md">結果を確定登録</button>
                      </div>
                    </div>
                  </form>
                )}
              </div>
            )}
          </div>
        )}
      </div>
    </main>
  );
};
</script>
